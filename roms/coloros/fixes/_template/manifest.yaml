---
# Fix Manifest Template
# Copy this folder to roms/<rom>/fixes/<fix-name>/ and fill in the fields.
# Agents: every fix MUST have a manifest. No undocumented patches.

fix_id: example-fix
name: "Human-readable fix name"
rom: hyperos
component: ""          # e.g. ims, camera, audio, fingerprint, display, wifi
severity: ""           # critical | major | minor | cosmetic
status: draft          # draft | testing | verified | rolled-back

symptom: ""
# What breaks, exact error text, log lines, how to reproduce.

root_cause: ""
# What the actual cause is. "Unknown" until diagnosed.

affected_files: []
# - path: system_ext/priv-app/ims/lib/arm64/libimsmedia_jni.so
#   action: replace | patch | add | remove
#   source: <where the replacement comes from>

changes: []
# - description: ""
#   command: ""
#   reversible: true

verification: []
# - "Reboot device; confirm no crash in logcat for <tag>"
# - "Place a test call; confirm VoLTE connects"

rollback: []
# - "Restore original file from <path> in base/"

references: []
# - https://...

author: ""
date: ""

