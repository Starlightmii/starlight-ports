<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Starlight star logo</title>
  <desc id="desc">A four-point star inside a glowing orbit ring on a dark rounded badge.</desc>
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b1c"/>
      <stop offset="0.55" stop-color="#0d1338"/>
      <stop offset="1" stop-color="#1c0c34"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f9ff"/>
      <stop offset="0.4" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="blur" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="blur2" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <clipPath id="clip">
      <rect width="256" height="256" rx="56"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="256" height="256" fill="url(#badge)"/>
    <rect width="256" height="256" fill="url(#halo)"/>

    <g fill="#e0f2fe">
      <circle cx="44" cy="46" r="1.3" opacity="0.7"/>
      <circle cx="204" cy="40" r="1.1" opacity="0.6"/>
      <circle cx="220" cy="196" r="1.4" opacity="0.65"/>
      <circle cx="38" cy="204" r="1.1" opacity="0.55"/>
      <circle cx="128" cy="28" r="1" opacity="0.45"/>
      <circle cx="232" cy="122" r="1" opacity="0.4"/>
      <circle cx="22" cy="130" r="1.2" opacity="0.45"/>
      <circle cx="168" cy="226" r="1" opacity="0.4"/>
      <circle cx="78" cy="232" r="1.1" opacity="0.45"/>
    </g>

    <g fill="none" stroke="url(#ring)">
      <circle cx="128" cy="128" r="88" stroke-width="1.2" stroke-opacity="0.55"/>
      <circle cx="128" cy="128" r="70" stroke-width="0.8" stroke-opacity="0.3"/>
      <ellipse cx="128" cy="128" rx="108" ry="44" stroke-width="1" stroke-opacity="0.25" transform="rotate(-20 128 128)"/>
    </g>

    <g transform="translate(128 128)">
      <path d="M0 -74 C5 -25 25 -5 74 0 C25 5 5 25 0 74 C-5 25 -25 5 -74 0 C-25 -5 -5 -25 0 -74 Z" fill="url(#star)" filter="url(#blur)" opacity="0.8"/>
      <path d="M0 -62 C4 -21 21 -4 62 0 C21 4 4 21 0 62 C-4 21 -21 4 -62 0 C-21 -4 -4 -21 0 -62 Z" fill="url(#star)"/>
      <path d="M0 -62 C4 -21 21 -4 62 0" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1.6"/>
      <circle r="5.5" fill="#ffffff" filter="url(#blur2)"/>
    </g>

    <circle cx="210" cy="58" r="3" fill="#67e8f9" opacity="0.9"/>
    <circle cx="210" cy="58" r="8" fill="none" stroke="#67e8f9" stroke-opacity="0.35"/>

    <rect x="1" y="1" width="254" height="254" rx="55" fill="none" stroke="#7dd3fc" stroke-opacity="0.2"/>
  </g>
</svg>
