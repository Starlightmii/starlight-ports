        <text x="-2" y="-39.5" text-anchor="middle" fill="#c7d2fe" font-size="4.8" font-family="Arial, Helvetica, sans-serif">developer: starlight</text>
        <path d="M30 -45 C30.6 -42.4 32.4 -40.6 35 -40 C32.4 -39.4 30.6 -37.6 30 -35 C29.4 -37.6 27.6 -39.4 25 -40 C27.6 -40.6 29.4 -42.4 30 -45 Z" fill="#fbbf24"/>

