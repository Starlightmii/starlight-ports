<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Starlight — ColorOS 17 for Redmi Note 10 Pro Max</title>
  <desc id="desc">Dark starfield hero banner with a four-point star logo and the Starlight wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060f"/>
      <stop offset="0.45" stop-color="#0b1030"/>
      <stop offset="1" stop-color="#1b0b33"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.17" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#4f46e5" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.78" cy="0.18" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.45" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="420" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#glowA)"/>
    <rect width="1200" height="420" fill="url(#glowB)"/>

    <!-- faint grid -->
    <g stroke="#7dd3fc" stroke-opacity="0.05" stroke-width="1">
      <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200"/>
      <path d="M120 0V420M240 0V420M360 0V420M480 0V420M600 0V420M720 0V420M840 0V420M960 0V420M1080 0V420"/>
    </g>

    <!-- starfield -->
    <g fill="#e0f2fe">
      <circle cx="62" cy="48" r="1.5" opacity="0.7"/>
      <circle cx="148" cy="86" r="1" opacity="0.5"/>
      <circle cx="235" cy="38" r="1.8" opacity="0.8"/>
      <circle cx="318" cy="120" r="1.1" opacity="0.45"/>
      <circle cx="410" cy="52" r="1.4" opacity="0.65"/>
      <circle cx="505" cy="104" r="1" opacity="0.4"/>
      <circle cx="590" cy="46" r="1.7" opacity="0.75"/>
      <circle cx="690" cy="96" r="1.2" opacity="0.5"/>
      <circle cx="780" cy="38" r="1.5" opacity="0.7"/>
      <circle cx="870" cy="118" r="1" opacity="0.45"/>
      <circle cx="960" cy="60" r="1.8" opacity="0.8"/>
      <circle cx="1050" cy="110" r="1.2" opacity="0.5"/>
      <circle cx="1140" cy="52" r="1.6" opacity="0.7"/>
      <circle cx="92" cy="176" r="1.2" opacity="0.5"/>
      <circle cx="190" cy="236" r="1" opacity="0.4"/>
      <circle cx="70" cy="310" r="1.7" opacity="0.7"/>
      <circle cx="142" cy="372" r="1.2" opacity="0.5"/>
      <circle cx="260" cy="322" r="1.4" opacity="0.6"/>
      <circle cx="352" cy="378" r="1" opacity="0.4"/>
      <circle cx="450" cy="300" r="1.6" opacity="0.65"/>
      <circle cx="548" cy="366" r="1.1" opacity="0.45"/>
      <circle cx="650" cy="312" r="1.5" opacity="0.6"/>
      <circle cx="748" cy="378" r="1" opacity="0.4"/>
      <circle cx="846" cy="320" r="1.7" opacity="0.7"/>
      <circle cx="944" cy="372" r="1.2" opacity="0.5"/>
      <circle cx="1044" cy="306" r="1.5" opacity="0.65"/>
      <circle cx="1136" cy="368" r="1" opacity="0.4"/>
      <circle cx="300" cy="200" r="1" opacity="0.35"/>
      <circle cx="560" cy="200" r="1.2" opacity="0.4"/>
      <circle cx="820" cy="210" r="1" opacity="0.35"/>
      <circle cx="1010" cy="200" r="1.3" opacity="0.45"/>
      <circle cx="1150" cy="230" r="1" opacity="0.35"/>
      <circle cx="36" cy="250" r="1.1" opacity="0.4"/>
      <circle cx="700" cy="150" r="1" opacity="0.3"/>
      <circle cx="880" cy="180" r="1.1" opacity="0.35"/>
    </g>

    <!-- orbit rings behind logo -->
    <g fill="none" stroke="url(#ring)" stroke-width="1.2">
      <circle cx="190" cy="210" r="118" stroke-opacity="0.5"/>
      <circle cx="190" cy="210" r="92" stroke-opacity="0.3"/>
      <ellipse cx="190" cy="210" rx="150" ry="58" stroke-opacity="0.22" transform="rotate(-18 190 210)"/>
    </g>

    <!-- four-point star -->
    <g transform="translate(190 210)">
      <path d="M0 -96 C7 -32 32 -7 96 0 C32 7 7 32 0 96 C-7 32 -32 7 -96 0 C-32 -7 -7 -32 0 -96 Z" fill="url(#star)" filter="url(#soft)" opacity="0.75"/>
      <path d="M0 -78 C6 -26 26 -6 78 0 C26 6 6 26 0 78 C-6 26 -26 6 -78 0 C-26 -6 -6 -26 0 -78 Z" fill="url(#star)"/>
      <path d="M0 -78 C6 -26 26 -6 78 0" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="2"/>
      <circle cx="0" cy="0" r="7" fill="#ffffff" opacity="0.9" filter="url(#soft2)"/>
    </g>

    <!-- text block -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <text x="352" y="132" fill="#7dd3fc" font-size="17" font-weight="600" letter-spacing="5">STARLIGHT PORTS PRESENTS</text>
      <text x="348" y="232" fill="url(#word)" font-size="94" font-weight="800" letter-spacing="5">STARLIGHT</text>
      <text x="352" y="278" fill="#c7d2fe" font-size="25" font-weight="400" letter-spacing="1.2">ColorOS 17 · Redmi Note 10 Pro Max</text>

      <g font-size="15" font-weight="600" letter-spacing="1.4">
        <rect x="352" y="316" width="196" height="38" rx="19" fill="#0ea5e9" fill-opacity="0.13" stroke="#38bdf8" stroke-opacity="0.5"/>
        <text x="450" y="341" fill="#bae6fd" text-anchor="middle">sweetin · M2101K6I</text>
        <rect x="564" y="316" width="132" height="38" rx="19" fill="#8b5cf6" fill-opacity="0.13" stroke="#a78bfa" stroke-opacity="0.5"/>
        <text x="630" y="341" fill="#ddd6fe" text-anchor="middle">Android 17</text>
        <rect x="712" y="316" width="92" height="38" rx="19" fill="#22d3ee" fill-opacity="0.11" stroke="#67e8f9" stroke-opacity="0.45"/>
        <text x="758" y="341" fill="#cffafe" text-anchor="middle">V8</text>
      </g>

      <text x="1104" y="70" fill="#94a3b8" font-size="14" text-anchor="end" letter-spacing="1.5">CP2A.260605.016</text>
      <text x="1104" y="90" fill="#64748b" font-size="13" text-anchor="end" letter-spacing="1.2">STARLIGHT BUILD</text>
      <circle cx="1124" cy="64" r="3.5" fill="#22d3ee"/>
    </g>

    <rect x="1" y="1" width="1198" height="418" rx="25" fill="none" stroke="#7dd3fc" stroke-opacity="0.18"/>
  </g>
</svg>
