        <rect x="654" y="286" width="74" height="38" rx="19" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.55"/>
        <text x="691" y="310" fill="#fde68a" text-anchor="middle">V8</text>
      </g>

      <text x="260" y="370" fill="#8b97c4" font-size="13.5" letter-spacing="0.5">Recovery-flashable · no fastboot · no data wipe</text>
    </g>

