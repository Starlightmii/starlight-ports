          <rect x="2" y="8" width="22" height="22" rx="6" fill="#1e293b"/>
          <rect x="28" y="8" width="22" height="22" rx="6" fill="#b45309"/>
          <circle cx="-39" cy="19" r="3" fill="#e0f2fe" opacity="0.75"/>
