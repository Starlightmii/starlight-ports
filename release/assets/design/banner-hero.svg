<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Starlight — ColorOS 17 for Redmi Note 10 Pro Max</title>
  <desc id="desc">Deep-space hero banner with a gold four-point star, a gradient Starlight wordmark and a glowing phone silhouette showing the Starlight About banner.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04050e"/>
      <stop offset="0.45" stop-color="#0a1028"/>
      <stop offset="1" stop-color="#170a2e"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.12" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#6366f1" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="0.90" cy="0.22" r="0.55">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#f59e0b" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.62" cy="1" r="0.60">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.42" stop-color="#67e8f9"/>
      <stop offset="0.78" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset="0.40" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="0.35" stop-color="#fde68a"/>
      <stop offset="0.75" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.80"/>
      <stop offset="0.55" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.50"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111a3d"/>
      <stop offset="0.50" stop-color="#0c1333"/>
      <stop offset="1" stop-color="#1b1040"/>
    </linearGradient>
    <linearGradient id="miniBanner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1a44"/>
      <stop offset="0.55" stop-color="#16205c"/>
      <stop offset="1" stop-color="#2a1155"/>
    </linearGradient>
    <linearGradient id="reflect" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="phoneGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#6366f1" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shoot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#a5f3fc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="blurLg" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="blurSm" x="-80%" y="-80%" width="260%" height="260%">
