    <!-- wordmark and details -->
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="260" y="54" fill="#8b97c4" font-size="12.5" font-weight="600" letter-spacing="3">STARLIGHT BUILD · CP2A.260605.016</text>
