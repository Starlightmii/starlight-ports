<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">Starlight feature strip</title>
  <desc id="desc">Six feature cards on a deep-space panel: Dolby Atmos, GCam camera, performance tuning, custom apps, safe install and Circle to Search.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060f"/>
      <stop offset="0.52" stop-color="#0a1028"/>
      <stop offset="1" stop-color="#140a2e"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.12" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="0.90" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101736"/>
      <stop offset="1" stop-color="#0a0e24"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset="0.45" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="240" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)" font-family="Arial, Helvetica, sans-serif">
    <rect width="1200" height="240" fill="url(#bg)"/>
    <rect width="1200" height="240" fill="url(#glowCyan)"/>
    <rect width="1200" height="240" fill="url(#glowGold)"/>

    <g fill="#dbeafe" opacity="0.55">
      <circle cx="28" cy="26" r="1.1"/>
      <circle cx="182" cy="18" r="0.8"/>
      <circle cx="374" cy="14" r="1.0"/>
      <circle cx="566" cy="22" r="0.8"/>
      <circle cx="758" cy="16" r="1.1"/>
      <circle cx="950" cy="20" r="0.8"/>
      <circle cx="1168" cy="28" r="1.0"/>
      <circle cx="64" cy="216" r="0.9"/>
      <circle cx="256" cy="226" r="0.8"/>
      <circle cx="448" cy="218" r="1.0"/>
      <circle cx="640" cy="228" r="0.8"/>
      <circle cx="832" cy="220" r="0.9"/>
      <circle cx="1024" cy="228" r="0.8"/>
    </g>

    <g stroke="#7dd3fc" stroke-opacity="0.035" stroke-width="1">
      <path d="M0 60H1200M0 120H1200M0 180H1200"/>
      <path d="M120 0V240M360 0V240M600 0V240M840 0V240M1080 0V240"/>
    </g>

    <!-- card 1 · Dolby Atmos -->
    <g>
      <rect x="44" y="26" width="172" height="188" rx="22" fill="url(#card)" stroke="#2a3766" stroke-opacity="0.95"/>
      <rect x="66" y="26" width="128" height="2.5" rx="1.25" fill="url(#accent)" opacity="0.85"/>
      <circle cx="130" cy="92" r="31" fill="#0a1128" stroke="#2b3a67"/>
      <g transform="translate(130 92)">
        <g fill="url(#icon)">
          <rect x="-26.5" y="-8" width="5" height="16" rx="2.5"/>
          <rect x="-14.5" y="-17" width="5" height="34" rx="2.5"/>
          <rect x="-2.5" y="-27" width="5" height="54" rx="2.5"/>
          <rect x="9.5" y="-14" width="5" height="28" rx="2.5"/>
          <rect x="21.5" y="-21" width="5" height="42" rx="2.5"/>
        </g>
        <g fill="none" stroke="url(#icon)" stroke-width="2.2" stroke-linecap="round" opacity="0.55">
          <path d="M-36 -18 Q-46 0 -36 18"/>
          <path d="M36 -18 Q46 0 36 18"/>
        </g>
      </g>
      <circle cx="200" cy="42" r="2.2" fill="#fbbf24" opacity="0.8"/>
      <text x="130" y="158" fill="#e8eeff" font-size="19" font-weight="700" text-anchor="middle">Dolby Atmos</text>
      <text x="130" y="180" fill="#8b97c4" font-size="13" text-anchor="middle">LunarisDolby</text>
    </g>

    <!-- card 2 · GCam -->
    <g>
      <rect x="232" y="26" width="172" height="188" rx="22" fill="url(#card)" stroke="#2a3766" stroke-opacity="0.95"/>
      <rect x="254" y="26" width="128" height="2.5" rx="1.25" fill="url(#accent)" opacity="0.85"/>
      <circle cx="318" cy="92" r="31" fill="#0a1128" stroke="#2b3a67"/>
      <g transform="translate(318 92)">
        <g fill="none" stroke="url(#icon)" stroke-width="3" stroke-linejoin="round">
          <rect x="-30" y="-18" width="60" height="38" rx="8"/>
          <path d="M-12 -18 L-8 -26 H8 L12 -18"/>
          <circle cx="0" cy="2" r="11"/>
        </g>
        <circle cx="0" cy="2" r="4.5" fill="url(#gold)"/>
        <circle cx="22" cy="-10" r="2.6" fill="url(#gold)"/>
      </g>
      <circle cx="388" cy="42" r="2.2" fill="#fbbf24" opacity="0.8"/>
      <text x="318" y="158" fill="#e8eeff" font-size="19" font-weight="700" text-anchor="middle">Camera</text>
      <text x="318" y="180" fill="#8b97c4" font-size="13" text-anchor="middle">GCam · 108 MP</text>
    </g>

    <!-- card 3 · Performance -->
    <g>
      <rect x="420" y="26" width="172" height="188" rx="22" fill="url(#card)" stroke="#2a3766" stroke-opacity="0.95"/>
      <rect x="442" y="26" width="128" height="2.5" rx="1.25" fill="url(#accent)" opacity="0.85"/>
      <circle cx="506" cy="92" r="31" fill="#0a1128" stroke="#2b3a67"/>
      <g transform="translate(506 92)">
        <path d="M-30 12 A30 30 0 1 1 30 12" fill="none" stroke="url(#icon)" stroke-width="3.2" stroke-linecap="round"/>
        <g stroke="url(#icon)" stroke-width="2" stroke-linecap="round" opacity="0.55">
          <path d="M0 -18 L0 -24"/>
          <path d="M-21 -3 L-25 -7"/>
          <path d="M21 -3 L25 -7"/>
        </g>
        <path d="M0 12 L15 -11" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
        <circle r="5" fill="url(#gold)"/>
        <circle r="2" fill="#05060f" opacity="0.55"/>
      </g>
      <circle cx="576" cy="42" r="2.2" fill="#fbbf24" opacity="0.8"/>
      <text x="506" y="158" fill="#e8eeff" font-size="19" font-weight="700" text-anchor="middle">Performance</text>
      <text x="506" y="180" fill="#8b97c4" font-size="13" text-anchor="middle">smooth daily driver</text>
    </g>

    <!-- card 4 · Custom apps -->
    <g>
      <rect x="608" y="26" width="172" height="188" rx="22" fill="url(#card)" stroke="#2a3766" stroke-opacity="0.95"/>
      <rect x="630" y="26" width="128" height="2.5" rx="1.25" fill="url(#accent)" opacity="0.85"/>
      <circle cx="694" cy="92" r="31" fill="#0a1128" stroke="#2b3a67"/>
      <g transform="translate(694 92)">
        <rect x="-30" y="-30" width="24" height="24" rx="7" fill="url(#icon)"/>
        <rect x="6" y="-30" width="24" height="24" rx="7" fill="url(#icon)" opacity="0.72"/>
        <rect x="-30" y="6" width="24" height="24" rx="7" fill="url(#icon)" opacity="0.72"/>
        <rect x="6" y="6" width="24" height="24" rx="7" fill="url(#gold)"/>
        <g fill="#05060f" opacity="0.55">
          <circle cx="-18" cy="-18" r="3"/>
          <rect x="14" y="-21" width="8" height="6" rx="2"/>
          <path d="M-23 18 L-18 12 L-13 18 Z"/>
          <circle cx="18" cy="18" r="3"/>
        </g>
      </g>
      <circle cx="764" cy="42" r="2.2" fill="#fbbf24" opacity="0.8"/>
      <text x="694" y="158" fill="#e8eeff" font-size="19" font-weight="700" text-anchor="middle">Custom apps</text>
      <text x="694" y="180" fill="#8b97c4" font-size="13" text-anchor="middle">preloaded</text>
    </g>

    <!-- card 5 · Safe install -->
    <g>
      <rect x="796" y="26" width="172" height="188" rx="22" fill="url(#card)" stroke="#2a3766" stroke-opacity="0.95"/>
      <rect x="818" y="26" width="128" height="2.5" rx="1.25" fill="url(#accent)" opacity="0.85"/>
      <circle cx="882" cy="92" r="31" fill="#0a1128" stroke="#2b3a67"/>
      <g transform="translate(882 92)">
        <path d="M0 -28 L26 -18 V2 C26 18 15 28 0 33 C-15 28 -26 18 -26 2 V-18 Z" fill="url(#icon)" fill-opacity="0.14" stroke="url(#icon)" stroke-width="3"/>
        <path d="M-10 0 L-2 9 L13 -9" fill="none" stroke="url(#gold)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <circle cx="952" cy="42" r="2.2" fill="#fbbf24" opacity="0.8"/>
      <text x="882" y="158" fill="#e8eeff" font-size="19" font-weight="700" text-anchor="middle">Safe install</text>
      <text x="882" y="180" fill="#8b97c4" font-size="13" text-anchor="middle">no data wipe</text>
    </g>

    <!-- card 6 · Circle to Search -->
    <g>
      <rect x="984" y="26" width="172" height="188" rx="22" fill="url(#card)" stroke="#2a3766" stroke-opacity="0.95"/>
      <rect x="1006" y="26" width="128" height="2.5" rx="1.25" fill="url(#accent)" opacity="0.85"/>
      <circle cx="1070" cy="92" r="31" fill="#0a1128" stroke="#2b3a67"/>
      <g transform="translate(1070 92)">
        <g fill="none" stroke="url(#icon)" stroke-width="3.4" stroke-linecap="round">
          <circle cx="-3" cy="-3" r="23"/>
          <path d="M14 14 L30 30" stroke-width="5"/>
        </g>
        <path d="M0 -12 C0.9 -4.5 4.5 -0.9 12 0 C4.5 0.9 0.9 4.5 0 12 C-0.9 4.5 -4.5 0.9 -12 0 C-4.5 -0.9 -0.9 -4.5 0 -12 Z" transform="translate(-3 -3)" fill="url(#gold)" opacity="0.95"/>
        <circle cx="-3" cy="-3" r="2.2" fill="#ffffff" opacity="0.9"/>
        <path d="M0 -7 C0.5 -2.6 2.6 -0.5 7 0 C2.6 0.5 0.5 2.6 0 7 C-0.5 2.6 -2.6 0.5 -7 0 C-2.6 -0.5 -0.5 -2.6 0 -7 Z" transform="translate(24 -22)" fill="#67e8f9" opacity="0.8"/>
      </g>
      <circle cx="1140" cy="42" r="2.2" fill="#fbbf24" opacity="0.8"/>
      <text x="1070" y="158" fill="#e8eeff" font-size="16.5" font-weight="700" text-anchor="middle">Circle to Search</text>
      <text x="1070" y="180" fill="#8b97c4" font-size="13" text-anchor="middle">Google Lens</text>
    </g>

    <rect x="1" y="1" width="1198" height="238" rx="23" fill="none" stroke="#7dd3fc" stroke-opacity="0.16"/>
    <rect x="1" y="1" width="1198" height="238" rx="23" fill="none" stroke="url(#gold)" stroke-opacity="0.10"/>
  </g>
</svg>
