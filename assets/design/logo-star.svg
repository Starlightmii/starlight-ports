<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Starlight star logo</title>
  <desc id="desc">A glowing gold four-point star inside cyan and gold orbit rings on a deep-space rounded badge.</desc>

  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060f"/>
      <stop offset="0.52" stop-color="#0b1233"/>
      <stop offset="1" stop-color="#1b0b36"/>
    </linearGradient>
    <radialGradient id="haloCyan" cx="0.24" cy="0.22" r="0.62">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#6366f1" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloGold" cx="0.82" cy="0.84" r="0.55">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="0.32" stop-color="#fde68a"/>
      <stop offset="0.72" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset="0.45" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.50" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="ringCyan" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="0.55" stop-color="#67e8f9" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#a5f3fc" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="blurLg" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="blurSm" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <clipPath id="badgeClip">
      <rect width="256" height="256" rx="58"/>
    </clipPath>
  </defs>

  <g clip-path="url(#badgeClip)">
    <rect width="256" height="256" fill="url(#badge)"/>
    <rect width="256" height="256" fill="url(#haloCyan)"/>
    <rect width="256" height="256" fill="url(#haloGold)"/>

    <!-- starfield -->
    <g fill="#dbeafe">
      <circle cx="42" cy="44" r="1.2" opacity="0.65"/>
      <circle cx="204" cy="38" r="1.0" opacity="0.55"/>
      <circle cx="222" cy="196" r="1.3" opacity="0.60"/>
      <circle cx="36" cy="206" r="1.0" opacity="0.50"/>
      <circle cx="128" cy="26" r="0.9" opacity="0.42"/>
      <circle cx="232" cy="124" r="0.9" opacity="0.38"/>
      <circle cx="20" cy="132" r="1.1" opacity="0.42"/>
      <circle cx="168" cy="228" r="0.9" opacity="0.36"/>
      <circle cx="76" cy="234" r="1.0" opacity="0.40"/>
      <circle cx="198" cy="76" r="0.9" opacity="0.40"/>
      <circle cx="58" cy="156" r="0.9" opacity="0.36"/>
      <circle cx="150" cy="44" r="0.8" opacity="0.34"/>
    </g>

    <!-- orbit rings -->
    <g fill="none" stroke="url(#ring)">
      <circle cx="128" cy="128" r="92" stroke-width="1.1" stroke-opacity="0.45"/>
      <circle cx="128" cy="128" r="72" stroke-width="0.8" stroke-opacity="0.26"/>
      <ellipse cx="128" cy="128" rx="110" ry="42" stroke-width="1" stroke-opacity="0.20" transform="rotate(-20 128 128)"/>
    </g>
    <path d="M128 36 A92 92 0 0 1 220 128" fill="none" stroke="url(#gold)" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>
    <path d="M128 220 A92 92 0 0 1 36 128" fill="none" stroke="url(#ringCyan)" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
    <circle cx="220" cy="128" r="3.2" fill="#fbbf24"/>
    <circle cx="36" cy="128" r="2.8" fill="#67e8f9"/>

    <!-- central star -->
    <g transform="translate(128 128)">
      <path d="M0 -64 C4.8 -24.3 24.3 -4.8 64 0 C24.3 4.8 4.8 24.3 0 64 C-4.8 24.3 -24.3 4.8 -64 0 C-24.3 -4.8 -4.8 -24.3 0 -64 Z" fill="url(#star)" opacity="0.85" filter="url(#blurLg)"/>
      <path d="M0 -64 C4.8 -24.3 24.3 -4.8 64 0 C24.3 4.8 4.8 24.3 0 64 C-4.8 24.3 -24.3 4.8 -64 0 C-24.3 -4.8 -4.8 -24.3 0 -64 Z" fill="url(#star)"/>
      <path d="M0 -64 C4.8 -24.3 24.3 -4.8 64 0 C24.3 4.8 4.8 24.3 0 64 C-4.8 24.3 -24.3 4.8 -64 0 C-24.3 -4.8 -4.8 -24.3 0 -64 Z" fill="url(#gold)" opacity="0.10" transform="rotate(45) scale(0.78)"/>
      <path d="M0 -51 C3.8 -19.4 19.4 -3.8 51 0" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.5"/>
      <circle r="5.6" fill="#ffffff" opacity="0.9" filter="url(#blurSm)"/>
      <circle r="2.6" fill="#ffffff"/>
    </g>

    <!-- accent sparkles -->
    <path d="M0 -12 C0.9 -4.5 4.5 -0.9 12 0 C4.5 0.9 0.9 4.5 0 12 C-0.9 4.5 -4.5 0.9 -12 0 C-4.5 -0.9 -0.9 -4.5 0 -12 Z" transform="translate(208 62)" fill="url(#gold)" opacity="0.9"/>
    <path d="M0 -9 C0.7 -3.4 3.4 -0.7 9 0 C3.4 0.7 0.7 3.4 0 9 C-0.7 3.4 -3.4 0.7 -9 0 C-3.4 -0.7 -0.7 -3.4 0 -9 Z" transform="translate(48 196)" fill="#67e8f9" opacity="0.8"/>

    <rect x="1" y="1" width="254" height="254" rx="57" fill="none" stroke="#7dd3fc" stroke-opacity="0.20"/>
    <rect x="1" y="1" width="254" height="254" rx="57" fill="none" stroke="url(#gold)" stroke-opacity="0.12"/>
  </g>
</svg>
