<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="ctaTitle ctaDesc">
  <title id="ctaTitle">Download Starlight V8 — ColorOS 17 for Redmi Note 10 Pro Max</title>
  <desc id="ctaDesc">Deep-space download card with a gold Starlight star, a gradient download heading, a glowing gold call-to-action pill and the pixeldrain address.</desc>

  <defs>
    <linearGradient id="ctaBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04050e"/>
      <stop offset="0.48" stop-color="#0a1028"/>
      <stop offset="1" stop-color="#170a2e"/>
    </linearGradient>
    <linearGradient id="ctaEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9" stop-opacity=".85"/>
      <stop offset="0.42" stop-color="#818cf8" stop-opacity=".65"/>
      <stop offset="0.75" stop-color="#c084fc" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="ctaHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.45" stop-color="#67e8f9"/>
      <stop offset="0.8" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="ctaGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset="0.38" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="ctaPill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.35" stop-color="#fbbf24"/>
      <stop offset="0.72" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
    <radialGradient id="ctaGlowCyan" cx="0.1" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".28"/>
      <stop offset="0.6" stop-color="#6366f1" stop-opacity=".08"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ctaGlowGold" cx="0.92" cy="0.28" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity=".24"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="ctaBlurLg" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="ctaBlurSm" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="ctaStarGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="ctaFrame">
      <rect width="1200" height="320" rx="30"/>
    </clipPath>
  </defs>

  <g clip-path="url(#ctaFrame)">
    <rect width="1200" height="320" fill="url(#ctaBg)"/>
    <rect width="1200" height="320" fill="url(#ctaGlowCyan)"/>
    <rect width="1200" height="320" fill="url(#ctaGlowGold)"/>

    <!-- faint technical grid -->
    <g stroke="#7dd3fc" stroke-opacity="0.05" stroke-width="1">
      <path d="M0 64H1200M0 128H1200M0 192H1200M0 256H1200"/>
      <path d="M120 0V320M260 0V320M400 0V320M540 0V320M680 0V320M820 0V320M960 0V320M1100 0V320"/>
    </g>

    <!-- starfield -->
    <g fill="#dbeafe">
      <circle cx="42" cy="38" r="1.4" opacity=".7"/>
      <circle cx="146" cy="286" r="1.2" opacity=".5"/>
      <circle cx="236" cy="42" r="1.7" opacity=".75"/>
      <circle cx="322" cy="274" r="1" opacity=".4"/>
      <circle cx="418" cy="52" r="1.3" opacity=".6"/>
      <circle cx="486" cy="250" r="1.1" opacity=".42"/>
      <circle cx="566" cy="34" r="1.6" opacity=".7"/>
      <circle cx="648" cy="292" r="1" opacity=".4"/>
      <circle cx="742" cy="46" r="1.4" opacity=".65"/>
      <circle cx="846" cy="268" r="1.1" opacity=".44"/>
      <circle cx="936" cy="36" r="1.6" opacity=".72"/>
      <circle cx="1032" cy="288" r="1.2" opacity=".46"/>
      <circle cx="1122" cy="52" r="1.5" opacity=".64"/>
      <circle cx="1178" cy="248" r="1" opacity=".4"/>
    </g>

    <!-- orbit rings -->
    <g fill="none" stroke="url(#ctaEdge)" stroke-width="1.2" opacity=".35">
      <ellipse cx="1040" cy="160" rx="230" ry="118"/>
      <ellipse cx="1040" cy="160" rx="168" ry="86" opacity=".55"/>
    </g>

    <!-- inner hairline -->
    <rect x="10" y="10" width="1180" height="300" rx="24" fill="none" stroke="#e8eeff" stroke-opacity=".10"/>

    <!-- gold star mark -->
    <g transform="translate(64 104)" filter="url(#ctaStarGlow)">
      <path d="M0 -34 L8 -10 L32 0 L8 10 L0 34 L-8 10 L-32 0 L-8 -10 Z" fill="url(#ctaGold)"/>
      <circle cx="0" cy="0" r="7" fill="#fffdf5" opacity=".9"/>
    </g>
    <g fill="#67e8f9" filter="url(#ctaBlurSm)">
      <path d="M118 56 l2.6 6.4 6.4 2.6 -6.4 2.6 -2.6 6.4 -2.6 -6.4 -6.4 -2.6 6.4 -2.6 Z" opacity=".9"/>
    </g>

    <!-- copy -->
    <text x="132" y="86" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="4.2" fill="#67e8f9">READY TO FLASH</text>
    <text x="128" y="140" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5" fill="url(#ctaHead)">Download Starlight V8</text>
    <text x="130" y="176" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#c7d2fe">ColorOS 17 · Android 17 · <tspan font-weight="700" fill="#e8eeff">sweetin</tspan> · 5.74 GB</text>
    <text x="130" y="214" font-family="Arial, Helvetica, sans-serif" font-size="13.5" letter-spacing="0.4" fill="#8b97c4">Recovery-flashable · No data wipe · OrangeFox / adb sideload</text>

    <!-- CTA pill -->
    <g transform="translate(770 96)">
      <rect x="0" y="0" width="360" height="78" rx="39" fill="#fbbf24" opacity=".30" filter="url(#ctaBlurLg)"/>
      <rect x="0" y="0" width="360" height="78" rx="39" fill="url(#ctaPill)"/>
      <rect x="1.5" y="1.5" width="357" height="75" rx="37.5" fill="none" stroke="#fffdf5" stroke-opacity=".55" stroke-width="1.4"/>
      <circle cx="44" cy="39" r="21" fill="#1b1204" opacity=".14"/>
      <g fill="none" stroke="#1b1204" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M44 27 v19"/>
        <path d="M35 38 l9 9 9 -9"/>
        <path d="M32 54 h24"/>
      </g>
      <text x="80" y="47" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" letter-spacing="2.2" fill="#1b1204">GET THE ROM</text>
      <g fill="none" stroke="#1b1204" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M318 32 l10 7 -10 7"/>
        <path d="M296 39 h30"/>
      </g>
    </g>

    <!-- pixeldrain address -->
    <text x="950" y="204" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14.5" letter-spacing="0.8" fill="#8b97c4">pixeldrain.com/u/2wqy5C7s</text>

    <!-- corner accents -->
    <g fill="none" stroke="url(#ctaEdge)" stroke-width="2.6" stroke-linecap="round" opacity=".8">
      <path d="M28 60 V40 Q28 28 40 28 H60"/>
      <path d="M1140 28 H1160 Q1172 28 1172 40 V60"/>
      <path d="M1172 260 V280 Q1172 292 1160 292 H1140"/>
      <path d="M60 292 H40 Q28 292 28 280 V260"/>
    </g>
  </g>

  <!-- outer frame -->
  <rect x="2" y="2" width="1196" height="316" rx="30" fill="none" stroke="url(#ctaEdge)" stroke-width="3"/>
</svg>
